<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音声1往復テスト（case01）</title>
<style>
  body { font-family: system-ui, "Noto Sans JP", sans-serif; margin: 0; padding: 20px; background: #eef2f4; color: #1f2d33; font-size: 22px; line-height: 1.6; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  .card { background: #fff; border-radius: 12px; padding: 16px 20px; margin: 14px 0; box-shadow: 0 1px 6px rgba(0,0,0,.12); }
  h2 { font-size: 24px; margin: 0 0 6px; }
  button { font-size: 22px; padding: 12px 22px; margin: 6px 8px 6px 0; border: 0; border-radius: 10px; background: #2f6f8f; color: #fff; }
  button:disabled { background: #9db3bd; }
  pre { white-space: pre-wrap; background: #f6f8f9; padding: 10px; border-radius: 8px; font-size: 22px; }
  .small { font-size: 18px; color: #55666d; }
  .ng { color: #b3261e; font-weight: bold; }
  .ok { color: #1b6e3c; font-weight: bold; }
</style>
</head>
<body>
<h1>音声1往復テスト（case01・PoC）</h1>
<div class="small">マイク → Quest内の音声認識(Whisper tiny) → case01のQ&A照合 → <b>caseId+answerIdだけ</b>をTTS Workerへ送信 → 返ったMP3を再生。学生の音声・認識文字列はサーバーへ送りません。<br><b>患者音声はAI生成音声です</b></div>

<div class="card">
  <h2>1. モデルを読み込む</h2>
  <button id="btnLoad">モデルを読み込む（マイク許可）</button>
  <pre id="loadOut">（未読み込み）</pre>
</div>

<div class="card">
  <h2>2. 患者へ質問する</h2>
  <button id="btnRec" disabled>録音開始</button>
  <div class="small">「録音開始」→ 質問する（例：「痛みはありますか」）→ 「録音停止」。</div>
  <pre id="out">認識結果：
患者回答：
音声：</pre>
</div>

<script type="module">
import { asr, prepare, startRecording, stopAndRecognize, matchItem } from './asr.js';
const $ = (id) => document.getElementById(id);
// TTS Worker（Cloudflare）のURL。?tts=https://... でも上書き可。ここにAPIキーは置かない
const TTS_URL = new URLSearchParams(location.search).get('tts') || 'https://osce-tts.minami43mail.workers.dev/';
const CASE_ID = 'case01';
let CASE = null, ctx = null, cur = null;

// 既存のcase01 JSON（症例内容は読み取りのみ。患者回答の文字表示用）
const items = () => CASE.menu.filter((m) => m.type === 'dialogue').flatMap((m) => m.items);
const respOf = (it) => (typeof it.response === 'string' ? it.response : JSON.stringify(it.response));

// ユーザー操作の中で呼ぶ：AudioContextをresume（Questのautoplay制限対策）
function unlockAudio() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
}
// 送信するのは {caseId, answerId} のみ。返ったaudio/mpegをデコードして再生
async function speakViaWorker(answerId) {
  try {
    const r = await fetch(TTS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ caseId: CASE_ID, answerId }) });
    if (!r.ok) return '音声生成に失敗しました';
    const ab = await ctx.decodeAudioData(await r.arrayBuffer());
    if (cur) { try { cur.stop(); } catch (e) { /* noop */ } }
    cur = ctx.createBufferSource(); cur.buffer = ab; cur.connect(ctx.destination); cur.start();
    return '再生中（AI生成音声）';
  } catch (e) { return '音声生成に失敗しました'; }
}

asr.onChange = () => {
  if (asr.status === 'loading') $('loadOut').textContent = '読み込み中… ' + asr.note + '（初回は1〜3分）';
  else if (asr.status === 'ready') { $('loadOut').textContent = '読み込み完了'; $('btnRec').disabled = false; }
  else if (asr.status === 'error') { $('loadOut').textContent = '失敗：' + asr.note; $('btnLoad').disabled = false; }
};
$('btnLoad').onclick = () => { unlockAudio(); $('btnLoad').disabled = true; prepare(); };

let recording = false;
$('btnRec').onclick = async () => {
  unlockAudio();
  if (!recording) {
    if (!startRecording()) { $('out').textContent = '録音を開始できません'; return; }
    recording = true; $('btnRec').textContent = '録音停止'; $('out').textContent = '録音中…話してください。';
  } else {
    recording = false; $('btnRec').disabled = true; $('out').textContent = '認識中…';
    const text = await stopAndRecognize();
    const it = text ? matchItem(text, items()) : null;
    let sound = '-';
    if (it) sound = await speakViaWorker(it.id);
    $('out').innerHTML = '';
    const t = (s) => document.createTextNode(s);
    $('out').append(t(`認識結果：${text || '（認識できませんでした）'}\n`),
      t(`患者回答：${it ? respOf(it) : '（該当する質問なし）'}\n`),
      t(`照合した質問：${it ? it.id + '（' + it.label + '）' : '-'}\n`),
      t('音声：'), (() => { const e = document.createElement('span'); e.textContent = sound; e.className = sound.startsWith('音声生成に失敗') ? 'small ng' : 'small'; return e; })());
    $('btnRec').textContent = '録音開始'; $('btnRec').disabled = false;
  }
};
fetch('./cases/case01_stroke.json').then((r) => r.json()).then((j) => { CASE = j; });
</script>
</body>
</html>
